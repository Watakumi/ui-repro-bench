packages:
  - sandbox
  - packages/ui

# pnpm 11 のビルドスクリプト許可。esbuild は tsx の実行系、sharp は画像正規化に必須。
allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.282'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.282'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.282'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.282'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.282'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.282'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.282'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.282'
  - '@anthropic-ai/claude-agent-sdk@0.3.282'
